<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>React and Framer Motion test page</title>
    <script type="module" src="/src/fonts.ts"></script>
    <style>
      .pricing { display: grid; gap: 24px; padding: 40px; border-radius: 16px; background: #fff; }
      .pricing h2 { margin: 0; font-size: 28px; }
      .plans { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
      .plan { display: grid; gap: 12px; padding: 24px; border: 1px solid #e3e8ee; border-radius: 12px; background: #f6f9fc; }
      .plan h3 { margin: 0; font-size: 18px; }
      .price { margin: 0; font-size: 32px; font-weight: 700; }
      .price span { font-size: 14px; font-weight: 400; color: #425466; }
      .choose {
        padding: 10px 18px; border: 0; border-radius: 8px; cursor: pointer;
        font: 600 15px/1.2 "Inter", system-ui, sans-serif; color: #fff; background: #635bff;
      }
      .choose:focus-visible { outline: 3px solid #80e9ff; outline-offset: 2px; }
      @media (max-width: 640px) { .plans { grid-template-columns: 1fr; } .pricing { padding: 24px; } }
    </style>
  </head>
  <body>
    <main>
      <h1>React and Framer Motion</h1>
      <div id="root"></div>
    </main>
    <script type="module" src="/src/react-page.tsx"></script>
  </body>
</html>
