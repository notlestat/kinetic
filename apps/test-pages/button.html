<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Button test page</title>
    <script type="module" src="/src/fonts.ts"></script>
    <script type="module" src="/src/button-page.ts"></script>
    <style>
      .hero { display: grid; gap: 16px; justify-items: start; padding: 48px; border-radius: 16px; background: #fff; }
      .cta {
        display: inline-flex; align-items: center; gap: 8px;
        padding: 12px 24px; border: 0; border-radius: 999px;
        font: 600 16px/1.2 "Inter", system-ui, sans-serif; color: #fff; background: #635bff;
        box-shadow: 0 1px 2px rgba(10, 37, 64, 0.2);
        cursor: pointer;
        transition: background-color 150ms ease-out, transform 150ms ease-out, box-shadow 200ms cubic-bezier(0.2, 0, 0, 1);
      }
      .cta:hover { background: #0a2540; transform: translateY(-2px); box-shadow: 0 8px 24px rgba(10, 37, 64, 0.25); }
      .cta:focus-visible { outline: 3px solid #80e9ff; outline-offset: 3px; }
      .cta:active { transform: translateY(0); }
      .cta .arrow { display: inline-block; transition: transform 150ms ease-out; }
      .cta:hover .arrow { transform: translateX(3px); }
      @media (max-width: 480px) { .cta { width: 100%; justify-content: center; } }
      /* Moved by requestAnimationFrame in src/button-page.ts, so no CSS or WAAPI entry describes it. */
      .chip { display: inline-flex; align-items: center; gap: 8px; padding: 6px 12px; border-radius: 999px; color: #0a2540; background: #f6f9fc; text-decoration: none; font: 500 14px/1.2 "Inter", system-ui, sans-serif; }
      .chip .dot { width: 8px; height: 8px; border-radius: 50%; background: #00d924; }
    </style>
  </head>
  <body>
    <main>
      <h1>Button</h1>
      <section class="hero">
        <p>Primary call to action with hover, focus and active transitions.</p>
        <button class="cta" type="button" data-analytics-id="hero-cta" onclick="void 0">
          Start now <span class="arrow" aria-hidden="true">→</span>
        </button>
        <a class="chip" href="#pricing">See pricing <span class="dot" aria-hidden="true"></span></a>
      </section>
    </main>
  </body>
</html>
