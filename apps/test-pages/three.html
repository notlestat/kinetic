<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>three.js test page</title>
    <script type="module" src="/src/fonts.ts"></script>
    <style>
      .stage { position: relative; height: 200vh; }
      .stage canvas { position: sticky; top: 0; display: block; width: 100%; height: 100vh; border-radius: 16px; }
      .outro { min-height: 60vh; }
    </style>
  </head>
  <body>
    <main>
      <h1>three.js</h1>
      <p>A shader-lit torus knot that spins, with a camera that moves as the page scrolls.</p>
      <section class="stage"><canvas id="scene" aria-label="Spinning torus knot"></canvas></section>
      <p class="outro">End of the scroll scene.</p>
    </main>
    <script type="module" src="/src/three-page.ts"></script>
  </body>
</html>
