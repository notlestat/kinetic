<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GSAP, ScrollTrigger and Lenis test page</title>
    <script type="module" src="/src/fonts.ts"></script>
    <script type="module" src="/src/gsap-page.ts"></script>
    <style>
      .hero { display: flex; gap: 16px; padding: 48px 24px; }
      .hero-item { flex: 1; padding: 24px; border-radius: 12px; background: #fff; box-shadow: 0 1px 2px rgba(10, 37, 64, 0.1); }
      .hover-card { width: 240px; margin: 0 24px; padding: 24px; border-radius: 12px; color: #fff; background: #635bff; cursor: pointer; }
      .marquee { overflow: hidden; margin: 48px 0; white-space: nowrap; }
      .marquee-track { display: inline-flex; gap: 48px; font-size: 32px; font-weight: 600; }
      .spacer { height: 70vh; }
      .scrub-section { height: 120vh; padding: 48px 24px; background: #fff; }
      .scrub-box { width: 96px; height: 96px; border-radius: 16px; background: #0a2540; }
      .pin-section { display: grid; place-items: center; height: 100vh; background: #0a2540; color: #fff; }
      .pin-title { font-size: 48px; margin: 0; }
    </style>
  </head>
  <body>
    <section class="hero">
      <div class="hero-item">One</div>
      <div class="hero-item">Two</div>
      <div class="hero-item">Three</div>
    </section>
    <div class="hover-card">Hover me</div>
    <div class="marquee" aria-hidden="true">
      <div class="marquee-track"><span>Kinetic</span><span>Motion</span><span>Capture</span><span>Kinetic</span><span>Motion</span><span>Capture</span></div>
    </div>
    <div class="spacer"></div>
    <section class="scrub-section">
      <div class="scrub-box"></div>
    </section>
    <section class="pin-section">
      <h2 class="pin-title">Pinned</h2>
    </section>
    <div class="spacer"></div>
  </body>
</html>
